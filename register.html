
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BrainQuest</title>

    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🧠 BrainQuest</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="media.html">Media and Info</a>
                <a href="register.html">Register</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="register-section">

            <h1>Join BrainQuest!</h1>
            <p>Create your account and start learning.</p>

            <form action="#" method="get">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>

                <label for="subject">Favourite Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="math">Mathematics</option>
                    <option value="science">Science</option>
                    <option value="computers">Computers</option>
                    <option value="english">English</option>
                </select>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select an option</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Prefer not to say</option>
                </select>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I agree to the terms and conditions.
                </label>

                <button type="submit">Create Account 🚀</button>

            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 BrainQuest | University Project</p>
    </footer>

</body>
</html>
